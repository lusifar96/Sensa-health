<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root{
    --bg:#F3F6F1;
    --ink:#132420;
    --ink-soft:#3E4C47;
    --primary:#0E4F45;
    --primary-dark:#0A3A33;
    --primary-tint:#E4EFEA;
    --accent:#E2622F;
    --accent-tint:#FCE7DC;
    --surface:#FFFFFF;
    --muted:#6C7B75;
    --border:#DCE4DE;
    --success:#2F7D5C;
    --success-tint:#E4F3EA;
    --warn:#B7791F;
    --warn-tint:#FBF0DD;
    --danger:#B33F3F;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:18px;
    --shadow:0 1px 2px rgba(19,36,32,.06), 0 8px 24px rgba(19,36,32,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    color:var(--ink);
    margin:0 0 .4em 0;
    letter-spacing:-.01em;
  }
  p{margin:0 0 1em 0;color:var(--ink-soft);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::selection{background:var(--accent-tint);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  @media (max-width:720px){.wrap{padding:0 18px;}}

  /* NAV */
  #topnav{position:sticky;top:0;z-index:40;background:rgba(243,246,241,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px;}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-mark{width:30px;height:30px;position:relative;flex-shrink:0;}
  .logo-mark svg{width:100%;height:100%;}
  .logo-word{font-family:'Source Serif 4',serif;font-weight:600;font-size:20px;color:var(--primary-dark);}
  .logo-word em{font-style:normal;color:var(--accent);}
  .navlinks{display:flex;gap:28px;align-items:center;}
  .navlinks a{font-size:14px;font-weight:500;color:var(--ink-soft);padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
  .navlinks a:hover{color:var(--primary-dark);}
  .navlinks a.active{color:var(--primary-dark);border-color:var(--accent);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;}
  .icon-btn:hover{border-color:var(--primary);}
  .badge-dot{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;padding:10px 18px;border-radius:var(--radius-s);border:1px solid transparent;transition:transform .1s, background .15s, box-shadow .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:#c84f21;}
  .btn-outline{background:transparent;color:var(--primary-dark);border-color:var(--primary);}
  .btn-outline:hover{background:var(--primary-tint);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary-dark);}
  .btn-danger{background:transparent;color:var(--danger);border-color:#E7C7C7;}
  .btn-danger:hover{background:#FBEDED;}
  .btn-sm{padding:6px 12px;font-size:13px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* HERO */
  .hero{padding:64px 0 52px;position:relative;overflow:hidden;}
  .hero::before{
    content:'';position:absolute;top:-160px;right:-160px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(14,79,69,.16), rgba(14,79,69,0) 65%);
    z-index:0;pointer-events:none;
  }
  .hero::after{
    content:'';position:absolute;bottom:-140px;left:-120px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle at 60% 40%, rgba(226,98,47,.13), rgba(226,98,47,0) 65%);
    z-index:0;pointer-events:none;
  }
  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px;}}
  .eyebrow-plain{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .hero h1{font-size:44px;line-height:1.12;max-width:11.5ch;}
  @media (max-width:520px){.hero h1{font-size:32px;}}
  .hero-sub{font-size:16px;max-width:44ch;margin-bottom:26px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;}
  .trust-row{display:flex;gap:26px;flex-wrap:wrap;}
  .trust-stat b{display:block;font-family:'Source Serif 4',serif;font-size:22px;color:var(--primary-dark);}
  .trust-stat span{font-size:12.5px;color:var(--muted);}

  .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);box-shadow:var(--shadow);padding:22px;}
  .hero-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .hero-card-head span{font-size:12px;text-transform:none;color:var(--muted);}
  .live-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--success);background:var(--success-tint);padding:4px 9px;border-radius:20px;}
  .live-pill i{width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .mini-doc-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--border);}
  .mini-doc-row:first-of-type{border-top:none;}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0;}
  .avatar-photo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);background:var(--primary-tint);}
  .avatar-photo.lg{width:58px;height:58px;}
  .avatar-photo.xl{width:64px;height:64px;}
  .mini-doc-info{flex:1;min-width:0;}
  .mini-doc-info b{font-size:13.5px;display:block;}
  .mini-doc-info span{font-size:12px;color:var(--muted);}

  /* SECTIONS */
  section{padding:44px 0;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:20px;flex-wrap:wrap;}
  .section-head h2{font-size:28px;}
  .section-head p{margin:0;max-width:48ch;}

  .services-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:900px){.services-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.services-grid{grid-template-columns:1fr;}}
  .service-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:22px;cursor:pointer;transition:border-color .15s, transform .15s;}
  .service-card:hover{border-color:var(--primary);transform:translateY(-2px);}
  .service-icon{width:40px;height:40px;border-radius:10px;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--primary-dark);}
  .service-card h3{font-size:17px;margin-bottom:6px;}
  .service-card p{font-size:13.5px;margin-bottom:0;}

  /* CARD GRIDS (doctors/tests/hospitals) */
  .layout-with-filters{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start;}
  @media (max-width:840px){.layout-with-filters{grid-template-columns:1fr;}}
  .filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;position:sticky;top:82px;}
  .filter-group{margin-bottom:18px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-group label.title{font-size:12.5px;font-weight:600;color:var(--ink);display:block;margin-bottom:8px;}
  .filter-group select, .filter-group input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--ink-soft);cursor:pointer;}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .range-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;}
  input[type=range]{width:100%;accent-color:var(--primary);}

  .result-list{display:flex;flex-direction:column;gap:12px;}
  .card-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;display:flex;gap:16px;transition:box-shadow .18s, border-color .18s, transform .18s;}
  .card-row:hover{box-shadow:var(--shadow);border-color:#C9D6CF;transform:translateY(-1px);}

  /* Hospital card with banner photo */
  .hosp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;transition:box-shadow .18s, transform .18s;}
  .hosp-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
  .hosp-banner-wrap{position:relative;height:150px;background:var(--primary-tint);}
  .hosp-banner-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .hosp-icon-badge{position:absolute;left:14px;bottom:-16px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary-dark);box-shadow:0 4px 10px rgba(0,0,0,.12);}
  .hosp-card-body{padding:24px 18px 18px;}
  .hosp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:900px){.hosp-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.hosp-grid{grid-template-columns:1fr;}}
  @media (max-width:600px){.card-row{flex-direction:column;}}
  .card-row .avatar.lg{width:58px;height:58px;font-size:18px;}
  .card-row-main{flex:1;min-width:0;}
  .card-row-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card-row-top h4{font-size:16.5px;margin-bottom:2px;}
  .meta-line{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--primary-tint);color:var(--primary-dark);font-weight:500;}
  .tag.amber{background:var(--warn-tint);color:var(--warn);}
  .rating-pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .card-row-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
  @media (max-width:600px){.card-row-actions{align-items:stretch;flex-direction:row;}}
  .price-tag{font-family:'Source Serif 4',serif;font-size:19px;color:var(--primary-dark);}
  .price-tag span{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Sans',sans-serif;display:block;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(19,36,32,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal{background:var(--surface);border-radius:var(--radius-l);max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalin .18s ease;}
  @keyframes modalin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h3{font-size:18px;margin:0;}
  .modal-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);}
  .modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .field{margin-bottom:16px;}
  .field label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--bg);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}
  .seg{display:flex;border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;}
  .seg button{flex:1;padding:10px;background:var(--surface);border:none;font-size:13.5px;font-weight:500;color:var(--ink-soft);border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--primary);color:#fff;}
  .tc-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;font-size:12.5px;color:var(--muted);max-height:110px;overflow-y:auto;margin-bottom:10px;}
  .checkline{display:flex;align-items:flex-start;gap:8px;font-size:13px;}
  .checkline input{margin-top:3px;}
  .summary-box{background:var(--primary-tint);border-radius:var(--radius-s);padding:14px;margin-top:6px;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .summary-row.total{font-weight:700;border-top:1px solid rgba(14,79,69,.2);margin-top:6px;padding-top:8px;}

  .status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em;}
  .status-pending{background:var(--warn-tint);color:var(--warn);}
  .status-approved{background:var(--success-tint);color:var(--success);}
  .status-scheduled{background:var(--primary-tint);color:var(--primary-dark);}
  .status-rejected{background:#FBEDED;color:var(--danger);}
  .status-completed{background:#E7E7F3;color:#4B4B8F;}

  /* Page header */
  .page-head{padding:38px 0 8px;}
  .page-head h1{font-size:32px;}

  /* footer */
  footer{border-top:1px solid var(--border);margin-top:40px;padding:40px 0 28px;background:var(--surface);}
  .foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;}
  @media (max-width:700px){.foot-grid{grid-template-columns:1fr 1fr;}}
  .foot-grid h4{font-size:13px;color:var(--ink);margin-bottom:12px;}
  .foot-grid a, .foot-grid p{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .foot-bottom{margin-top:30px;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  /* Empty state */
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .glyph{font-size:34px;margin-bottom:10px;}

  /* Admin */
  .admin-shell{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:70vh;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;background:var(--surface);}
  @media (max-width:800px){.admin-shell{grid-template-columns:1fr;}}
  .admin-side{background:#0E2622;padding:22px 14px;}
  .admin-side .a-title{color:#fff;font-family:'Source Serif 4',serif;font-size:17px;padding:0 8px 18px;}
  .admin-side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#B9C9C3;padding:10px 10px;border-radius:8px;font-size:13.5px;font-weight:500;margin-bottom:2px;}
  .admin-side button.on{background:rgba(255,255,255,.08);color:#fff;}
  .admin-side button:hover{color:#fff;}
  .admin-main{padding:26px;}
  .admin-main h2{font-size:20px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .req-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media (max-width:700px){.stat-cards{grid-template-columns:1fr 1fr;}}
  .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;}
  .stat-card b{font-family:'Source Serif 4',serif;font-size:24px;display:block;color:var(--primary-dark);}
  .stat-card span{font-size:12px;color:var(--muted);}
  .admin-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .schedule-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .schedule-inline input{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:12.5px;}

  /* Notifications drawer */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:92vw;background:var(--surface);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:110;display:flex;flex-direction:column;}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-body{padding:14px 16px;overflow-y:auto;flex:1;}
  .notif-item{padding:12px;border-radius:var(--radius-s);background:var(--bg);margin-bottom:10px;border-left:3px solid var(--success);}
  .notif-item .n-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .notif-item p{margin:0;font-size:13px;color:var(--ink);}
  .wa-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:#128C7E;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:13.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);}

  .ambulance-track{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;}
  .vehicle-opt{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1.5px solid var(--border);border-radius:var(--radius-m);margin-bottom:10px;cursor:pointer;}
  .vehicle-opt.on{border-color:var(--primary);background:var(--primary-tint);}
  .vehicle-opt .vo-left{display:flex;align-items:center;gap:12px;}

  .hosp-tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .hosp-tabs button{padding:10px 16px;background:none;border:none;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
  .hosp-tabs button.on{color:var(--primary-dark);border-color:var(--accent);}

  .link-inline{color:var(--primary-dark);font-weight:600;text-decoration:underline;text-underline-offset:2px;}
  .muted-sm{font-size:12px;color:var(--muted);}
  textarea{resize:vertical;min-height:70px;}
  .upload-box{border:1.5px dashed var(--border);border-radius:var(--radius-s);padding:18px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;}
  .upload-box.filled{border-color:var(--success);color:var(--success);background:var(--success-tint);}

  .status-active{background:var(--success-tint);color:var(--success);}
  .status-suspended{background:#FBEDED;color:var(--danger);}
  .settings-card{max-width:440px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;}
  .center-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:20px;background:#EFE9F8;color:#5B3FA0;font-weight:500;}

  /* ============================================================
     MODERNIZATION: motion, hover, mobile nav, cart, payment gate
     ============================================================ */
  html{scroll-behavior:smooth;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px;}

  /* subtle page-in animation on every view render */
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  #app-root{animation:viewIn .38s cubic-bezier(.2,.7,.3,1);}

  .icon-btn{transition:transform .2s cubic-bezier(.2,.8,.3,1), border-color .2s, box-shadow .2s;}

  a{transition:color .15s;}
  .chip{transition:transform .15s, background .15s, border-color .15s;}

  input,select,textarea{transition:border-color .18s, box-shadow .18s;}

function fmtMoney(n){return '₹'+Number(n).toLocaleString('en-IN');}

/* ---------------- UPI PAYMENT (used by every booking checkout) ---------------- */
const PAY_UPI_ID = 'suvodeep.27oct.1996-1@okaxis';
const PAY_PAYEE   = 'Sensa Health';
function upiUri(amount, note){
  return `upi://pay?pa=${PAY_UPI_ID}&pn=${encodeURIComponent(PAY_PAYEE)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;
}
function upiPayBlock(amount, note){
  const uri = upiUri(amount, note);
  const qr  = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(uri)}`;
  return `
  <div class="upi-pay">
    <div class="fee-amt">${fmtMoney(amount)}</div>
    <p class="muted-sm" style="margin-bottom:0;">${note}</p>
    <div class="qr-box"><img src="${qr}" alt="UPI payment QR code" loading="lazy"></div>
    <div class="upi-line">
      <span>${PAY_UPI_ID}</span>
      <button class="copy-btn" type="button" onclick="copyUpiId()">Copy</button>
    </div>
    <div class="upi-apps">
      <a href="${uri}">Open UPI app</a>
      <a href="${uri.replace('upi://','gpay://upi/')}">GPay</a>
      <a href="${uri.replace('upi://','phonepe://')}">PhonePe</a>
      <a href="${uri.replace('upi://','paytmmp://')}">Paytm</a>
    </div>
  </div>
  <div class="field">
    <label>UPI transaction / UTR number</label>
    <input type="text" id="upi-utr" inputmode="numeric" maxlength="12" placeholder="12-digit UTR from your payment app">
  </div>
  <p class="pay-note">Scan the QR or tap an app above, pay ${fmtMoney(amount)}, then copy the 12-digit UTR / transaction ID from your payment receipt and paste it here. Your booking stays <b>pending</b> until the admin verifies this payment.</p>`;
}
function copyUpiId(){
  if(navigator.clipboard){
    navigator.clipboard.writeText(PAY_UPI_ID).then(()=>showToast('UPI ID copied'))
      .catch(()=>showToast('Copy this UPI ID: '+PAY_UPI_ID));
  } else { showToast('Copy this UPI ID: '+PAY_UPI_ID); }
}
/* returns the UTR if valid, else shows an error and returns null */
function readUtr(){
  const el = document.getElementById('upi-utr');
  const val = (el ? el.value : '').trim();
  if(!/^\d{12}$/.test(val)){
    showToast('Enter the 12-digit UTR number from your UPI app');
    if(el){ el.style.borderColor = 'var(--danger)'; el.focus(); }
    return null;
  }
  return val;
}
function payFields(utr){
  return {paid:true, payMethod:'UPI', txnRef:utr, payStatus:'Unverified', paidAt:new Date()};
}
function today(){return new Date().toISOString().split('T')[0];}
function addNotification(text, tag){
  const n = {id:uid('n'), text, ts:new Date(), tag: tag||'update'};
  state.notifications.unshift(n);
  state.adminLog.unshift({id:uid('log'), text:'WhatsApp → '+(state.user? state.user.phone : '+91 9xxxxxxxxx')+': '+text, ts:new Date()});
}
function showToast(msg){
  state.toast = msg;
  renderToast();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{state.toast=null; renderToast();}, 2600);
}

  state.view = view;
  state.params = params||{};
  window.scrollTo({top:0, behavior:'instant'});

}

}

      <button class="icon-btn" onclick="toggleCart()" title="Cart" style="position:relative;">
        ${ICONS.cart}
        ${cartQty? `<span class="cart-count">${cartQty}</span>`:''}
      </button>
      <button class="icon-btn" onclick="toggleDrawer()" title="Notifications">
        ${ICONS.bell}
        ${state.notifications.length? `<span class="badge-dot">${state.notifications.length}</span>`:''}
      </button>
      <button class="icon-btn" onclick="go('profile')" title="Profile">${ICONS.user}</button>
      ${state.user ? '' : `<button class="btn btn-primary btn-sm" onclick="openProfileModal()">Sign in</button>`}
      <button class="nav-hamburger" onclick="toggleMobileNav()" title="Menu">
        <span style="${state.mobileNavOpen?'transform:translateY(6px) rotate(45deg);':''}"></span>
        <span style="${state.mobileNavOpen?'opacity:0;':''}"></span>

      </button>
    </div>

  <div class="mobile-nav-panel">

  </div>`:''}`;
}
function toggleMobileNav(){
  state.mobileNavOpen = !state.mobileNavOpen;
  renderNav();
}

/* ---------------- DRAWER (notifications) ---------------- */
function toggleDrawer(){
  state.drawerOpen = !state.drawerOpen;
  renderDrawer();
}
function renderDrawer(){
  const el = document.getElementById('drawer-root');
  if(!state.drawerOpen){el.innerHTML='';return;}
  el.innerHTML = `
  <div class="modal-overlay" style="background:rgba(19,36,32,.25);align-items:stretch;justify-content:flex-end;padding:0;" onclick="if(event.target===this){toggleDrawer()}">
    <div class="drawer">
      <div class="drawer-head">
        <h3 style="margin:0;font-size:16px;">Live notifications</h3>
        <button class="modal-close" onclick="toggleDrawer()">✕</button>
      </div>
      <div class="drawer-body">
        ${state.notifications.length ? state.notifications.map(n=>`
          <div class="notif-item">
            <div class="n-top"><span class="wa-tag">${ICONS.wa} WhatsApp</span><span>${timeAgo(n.ts)}</span></div>
            <p>${n.text}</p>
          </div>
        `).join('') : `<div class="empty-state"><div class="glyph">🔔</div><p>No notifications yet. Updates on your requests will appear here and be sent to your WhatsApp.</p></div>`}
      </div>
    </div>
  </div>`;
}
function timeAgo(ts){
  const s = Math.floor((new Date()-new Date(ts))/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function renderToast(){
  const el = document.getElementById('toast-root');
  el.innerHTML = state.toast ? `<div class="toast">${state.toast}</div>` : '';
}

/* ---------------- CART (diagnostic tests) ---------------- */
function cartTotalQty(){
  return state.cart.reduce((s,c)=>s+c.qty,0);
}
function cartTotalAmount(){
  return state.cart.reduce((s,c)=>{
    const t = state.tests.find(x=>x.id===c.testId);
    return t ? s + t.price*c.qty : s;
  },0);
}
function addToCart(testId){
  const existing = state.cart.find(c=>c.testId===testId);
  if(existing){ existing.qty++; }
  else { state.cart.push({testId, qty:1}); }
  const t = state.tests.find(x=>x.id===testId);
  showToast(`${t.name} added to cart`);
  renderNav();
  if(state.cartOpen) renderCartDrawer();
}
function updateCartQty(testId, delta){
  const item = state.cart.find(c=>c.testId===testId);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0){ state.cart = state.cart.filter(c=>c.testId!==testId); }
  renderNav();
  renderCartDrawer();
}
function removeFromCart(testId){
  state.cart = state.cart.filter(c=>c.testId!==testId);
  renderNav();
  renderCartDrawer();
}
function toggleCart(){
  state.cartOpen = !state.cartOpen;
  renderCartDrawer();
}
function renderCartDrawer(){
  const el = document.getElementById('cart-root');
  if(!state.cartOpen){ el.innerHTML=''; return; }
  const items = state.cart.map(c=>({...c, test: state.tests.find(x=>x.id===c.testId)})).filter(c=>c.test);
  const total = cartTotalAmount();
  el.innerHTML = `
  <div class="modal-overlay" style="background:rgba(19,36,32,.25);align-items:stretch;justify-content:flex-end;padding:0;" onclick="if(event.target===this){toggleCart()}">
    <div class="drawer">
      <div class="drawer-head">
        <h3 style="margin:0;font-size:16px;">Your cart ${items.length? `(${cartTotalQty()})`:''}</h3>
        <button class="modal-close" onclick="toggleCart()">✕</button>
      </div>
      <div class="drawer-body">
        ${items.length ? items.map(c=>`
          <div class="cart-item">
            <div class="cart-item-icon">${c.test.category==='Radiology'?'RX':'PT'}</div>
            <div class="cart-item-main">
              <b>${c.test.name}</b>
              <span>${c.test.category} · ${centerName(c.test.center)}</span>
              <div class="cart-qty">
                <button onclick="updateCartQty('${c.testId}',-1)">−</button>
                <span>${c.qty}</span>
                <button onclick="updateCartQty('${c.testId}',1)">+</button>
              </div>
              <span class="cart-remove" onclick="removeFromCart('${c.testId}')">Remove</span>
            </div>
            <div class="cart-item-price">${fmtMoney(c.test.price*c.qty)}</div>
          </div>
        `).join('') : `<div class="cart-empty"><div class="glyph">🛒</div><p>Your cart is empty. Add diagnostic tests from the Diagnostics page to book them together.</p></div>`}
      </div>
      ${items.length ? `
      <div class="cart-summary">
        <div class="summary-row total"><span>Total</span><span>${fmtMoney(total)}</span></div>
        <button class="btn btn-accent btn-block" style="margin-top:10px;" onclick="checkoutCart()">Checkout &amp; pay</button>
      </div>`:''}
    </div>
  </div>`;
}
function checkoutCart(){
  if(!requireLogin(checkoutCart)) return;
  if(!state.cart.length) return;
  const items = state.cart.map(c=>({...c, test: state.tests.find(x=>x.id===c.testId)}));
  const total = cartTotalAmount();
  openModalHTML(`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head"><h3>Checkout — ${items.length} test${items.length!==1?'s':''}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        ${items.map(c=>`<div class="summary-row"><span>${c.test.name} × ${c.qty}</span><span>${fmtMoney(c.test.price*c.qty)}</span></div>`).join('')}
        ${upiPayBlock(total, `${items.length} diagnostic test${items.length!==1?'s':''}`)}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="toggleCart();closeModal();toggleCart();">Back to cart</button>
        <button class="btn btn-accent" onclick="submitCartCheckout()">I've paid — submit booking</button>
      </div>
    </div>
  </div>`);
}
function submitCartCheckout(){
  const utr = readUtr(); if(!utr) return;
  const items = state.cart.map(c=>({...c, test: state.tests.find(x=>x.id===c.testId)}));
  const totalPaid = cartTotalAmount();
  items.forEach(c=>{
    const req = {id:uid('DR'), testId:c.test.id, testName:c.test.name+(c.qty>1?` × ${c.qty}`:''), collection:c.test.home?'Home':'Lab', date:today(), time:'09:00', fee:c.test.price*c.qty, status:'Pending', rx:false, patient:state.user.name, phone:state.user.phone, createdAt:new Date(), ...payFields(utr)};
    state.diagRequests.unshift(req);
  });
  addNotification(`Your booking for ${items.length} test${items.length!==1?'s':''} is received. UPI payment of ${fmtMoney(totalPaid)} (UTR ${utr}) is awaiting verification.`);
  state.cart = [];
  state.cartOpen = false;
  closeModal();
  renderNav();
  renderCartDrawer();
  showToast('Booking sent — pending admin approval');
  go('profile');
}

function viewHome(){
  const topDocs = state.doctors.slice(0,3);
  return `
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="eyebrow-plain">Doctors · Diagnostics · Hospitals · Ambulance — one platform</div>
        <h1>Care that's coordinated, not scattered.</h1>
        <p class="hero-sub">Book a doctor for a clinic visit or a video call, schedule a lab test at home, reserve a hospital procedure, or call an ambulance — and track every step until it's confirmed.</p>
        <div class="hero-actions">
          <button class="btn btn-accent" onclick="go('doctors')">Consult a Doctor</button>
          <button class="btn btn-outline" onclick="go('diagnostics')">Book a Test</button>
        </div>
        <div class="trust-row">
          <div class="trust-stat"><b>${state.doctors.length*180}+</b><span>consultations completed</span></div>
          <div class="trust-stat"><b>${state.hospitals.length}</b><span>partner hospitals</span></div>
          <div class="trust-stat"><b>4.7★</b><span>average patient rating</span></div>
          <div class="trust-stat"><b>24×7</b><span>ambulance dispatch</span></div>
        </div>
      </div>
      <div class="hero-card">
        <div class="hero-card-head">
          <span>Available right now</span>
          <span class="live-pill"><i></i>Live</span>
        </div>
        ${topDocs.map(d=>`
          <div class="mini-doc-row">
            ${avatarImg(d,'')}
            <div class="mini-doc-info">
              <b>${d.name}</b>
              <span>${d.dept} · ${fmtMoney(d.fees)} · ${d.rating}★</span>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="openDoctorProfile('${d.id}')">View</button>
          </div>
        `).join('')}
      </div>
    </div>
  </section>

  <section class="wrap">
    <div class="section-head">
      <div><h2>What do you need today?</h2><p>Four core services, each with its own filters, approvals and WhatsApp updates.</p></div>
    </div>
    <div class="services-grid">
      <div class="service-card" onclick="go('doctors')">
        <div class="service-icon">${ICONS.stethoscope}</div>
        <h3>Doctor Consultation</h3>
        <p>In-clinic visits or online video/audio calls, filtered by fee, department, location and rating.</p>
      </div>
      <div class="service-card" onclick="go('diagnostics')">
        <div class="service-icon">${ICONS.vial}</div>
        <h3>Diagnostics</h3>
        <p>Radiology and pathology tests with home collection, prescription upload and price filters.</p>
      </div>
      <div class="service-card" onclick="go('hospitals')">
        <div class="service-icon">${ICONS.hospital}</div>
        <h3>Hospitals</h3>
        <p>Compare hospital features and request IPD bookings for surgeries and procedures.</p>
      </div>
      <div class="service-card" onclick="go('ambulance')">
        <div class="service-icon">${ICONS.ambulance}</div>
        <h3>Ambulance</h3>
        <p>Cab-style ambulance booking — set pickup and drop, choose a vehicle, request dispatch.</p>
      </div>
    </div>
  </section>

  <section class="wrap">

        </div>
      </div>
    </div>`);

        </div>

    </div>`);

function submitDoctorRequest(id){
  if(!requireLogin(()=>openBookDoctor(id,2))) return;
  const utr = readUtr(); if(!utr) return;
  const d = state.doctors.find(x=>x.id===id);
  const draft = state.draft.doctor;
  const req = {
    id: uid('CR'), doctorId:d.id, doctorName:d.name, dept:d.dept, mode:draft.mode,
    date:draft.date, time:draft.time, fee:d.fees+20, status:'Pending',
    patient: state.user.name, phone: state.user.phone, createdAt:new Date(),
    ...payFields(utr)
  };
  state.consultRequests.unshift(req);
  addNotification(`Your request for ${d.name} (${draft.mode}) on ${draft.date} at ${draft.time} is received. UPI payment of ${fmtMoney(req.fee)} (UTR ${utr}) is awaiting verification.`);
  closeModal();
  showToast('Consultation request sent — pending admin approval');
  go('profile');
}

/* ---- Live map state ---- */
const MAP_TILE = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const MAP_ATTR = '&copy; OpenStreetMap contributors';
const DEFAULT_CENTER = [22.5726, 88.3639]; // Kolkata
const AMB = {map:null, pickupMarker:null, dropMarker:null, line:null, meMarker:null, accCircle:null, watchId:null, live:false, resizeBound:false};

function ambDraft(){
  state.draft.amb = state.draft.amb || {pickup:'', drop:'', pickupLL:null, dropLL:null, vehicle:(state.ambulanceFleet[0]&&state.ambulanceFleet[0].name)||'Basic Life Support', agree:false, setting:'pickup', geoError:''};
  return state.draft.amb;
}
function haversineKm(a, b){
  if(!a || !b) return 0;
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b[0]-a[0]), dLon=toRad(b[1]-a[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function ambDistanceKm(){
  const d = ambDraft();
  // road distance is longer than straight line — 1.35x is a reasonable urban factor
  return haversineKm(d.pickupLL, d.dropLL) * 1.35;
}
function ambFare(){
  const d = ambDraft();
  const v = state.ambulanceFleet.find(x=>x.name===d.vehicle) || {price:600};
  const km = ambDistanceKm();
  return Math.round(v.price + km*22); // base + ₹22/km
}
function ambEtaMins(){
  const km = ambDistanceKm();
  return km ? Math.max(6, Math.round(km/0.45)) : 0; // ~27 km/h city average, min 6 min
}

/* ---- map mounting & interaction ---- */
/* Leaflet loads from a CDN with `defer`, so on a slow connection it may not be
   ready the instant the ambulance page renders. Poll for it instead of relying
   on the window 'load' event, which may already have fired by the time we check. */
function ensureLeaflet(onReady, onFail, attemptsLeft){
  if(typeof L !== 'undefined') return onReady();
  attemptsLeft = attemptsLeft==null ? 40 : attemptsLeft; // ~10s at 250ms
  if(attemptsLeft <= 0) return onFail();
  setTimeout(()=>ensureLeaflet(onReady, onFail, attemptsLeft-1), 250);
}
function mapLoadingHTML(id){
  return `<div style="padding:32px 20px;text-align:center;font-size:13px;color:var(--muted);">
    <div class="spinner" style="margin:0 auto 10px;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;"></div>
    Loading map…
  </div>`;
}
function mapFailHTML(retryFn){
  return `<div style="padding:28px 20px;text-align:center;font-size:13px;color:var(--muted);">
    The map couldn't load — check your internet connection.<br>
    <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="${retryFn}">Retry</button>
  </div>`;
}
function pinIcon(color, glyph){
  return L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-28],
    html:`<div class="pin-badge" style="background:${color}"><span>${glyph}</span></div>`});
}
function mountAmbMap(){
  const el = document.getElementById('amb-map');
  if(!el) return;
  el.innerHTML = mapLoadingHTML();
  ensureLeaflet(()=>{
    const el2 = document.getElementById('amb-map');
    if(!el2 || state.view!=='ambulance') return; // user navigated away while we waited
    el2.innerHTML = '';
    if(el2._leaflet_id) delete el2._leaflet_id; // defensive: avoid "container already initialized"
    const d = ambDraft();
    const center = d.pickupLL || d.dropLL || DEFAULT_CENTER;
    AMB.map = L.map(el2, {zoomControl:false, attributionControl:true}).setView(center, d.pickupLL?15:12);
    L.control.zoom({position:'bottomright'}).addTo(AMB.map); // bottom-right so it never fights the top chip row on small screens
    L.tileLayer(MAP_TILE, {maxZoom:19, attribution:MAP_ATTR}).addTo(AMB.map);
    AMB.map.on('click', e=>placePin(ambDraft().setting, [e.latlng.lat, e.latlng.lng], true));
    AMB.pickupMarker = AMB.dropMarker = AMB.line = AMB.meMarker = AMB.accCircle = null;
    if(d.pickupLL) drawPin('pickup', d.pickupLL);
    if(d.dropLL) drawPin('drop', d.dropLL);
    drawRouteLine();
    setTimeout(()=>AMB.map && AMB.map.invalidateSize(), 120);
    if(!AMB.resizeBound){ window.addEventListener('resize', ()=>AMB.map && AMB.map.invalidateSize()); AMB.resizeBound = true; }
    if(AMB.live) startLiveWatch(false); // re-attach the live dot after a re-render
  }, ()=>{
    const el3 = document.getElementById('amb-map');
    if(el3) el3.innerHTML = mapFailHTML('mountAmbMap()');
  });
}
function drawPin(which, ll){
  if(!AMB.map) return;
  const isPickup = which==='pickup';
  const icon = pinIcon(isPickup?'#E2622F':'#0E4F45', isPickup?'📍':'🏥');
  const key = isPickup?'pickupMarker':'dropMarker';
  if(AMB[key]){ AMB[key].setLatLng(ll); }
  else {
    AMB[key] = L.marker(ll, {icon, draggable:true}).addTo(AMB.map)
      .bindTooltip(isPickup?'Pickup':'Drop / hospital', {direction:'top', offset:[0,-28]});
    AMB[key].on('dragend', e=>{
      const p = e.target.getLatLng();
      placePin(which, [p.lat, p.lng], true);
    });
  }
}
function drawRouteLine(){
  const d = ambDraft();
  if(!AMB.map) return;
  if(AMB.line){ AMB.map.removeLayer(AMB.line); AMB.line = null; }
  if(d.pickupLL && d.dropLL){
    AMB.line = L.polyline([d.pickupLL, d.dropLL], {color:'#0E4F45', weight:4, opacity:.75, dashArray:'8 8'}).addTo(AMB.map);
    AMB.map.fitBounds(L.latLngBounds([d.pickupLL, d.dropLL]).pad(0.3));
  }
}
function placePin(which, ll, reverse){
  const d = ambDraft();
  if(which==='drop') d.dropLL = ll; else d.pickupLL = ll;
  drawPin(which, ll);
  drawRouteLine();
  updateFareUI();
  if(reverse) reverseGeocode(ll, which);
}
function setPinMode(mode){
  ambDraft().setting = mode;
  document.querySelectorAll('.map-overlay .map-chip').forEach(b=>{
    if(b.textContent.trim().toLowerCase().startsWith('set ')) b.classList.toggle('on', b.textContent.toLowerCase().includes(mode));
  });
  showToast(mode==='pickup'?'Tap the map to set the pickup point':'Tap the map to set the drop point');
}
function updateFareUI(){
  const d = ambDraft();
  const km = ambDistanceKm();
  const veh = state.ambulanceFleet.find(v=>v.name===d.vehicle) || {price:0};
  const set = (id, val)=>{ const el=document.getElementById(id); if(el) el.innerHTML = val; };
  const foot = document.getElementById('amb-map-foot');
  if(foot) foot.innerHTML = `
    <div><span class="lbl">Distance</span><b>${km?km.toFixed(1)+' km':'—'}</b></div>
    <div><span class="lbl">ETA</span><b>${km?ambEtaMins()+' min':'—'}</b></div>
    <div><span class="lbl">Est. fare</span><b>${(d.pickupLL&&d.dropLL)?fmtMoney(ambFare()):'—'}</b></div>`;
  set('amb-base', fmtMoney(veh.price));
  set('amb-dist', km?fmtMoney(Math.round(km*22)):'—');
  set('amb-total', (d.pickupLL&&d.dropLL)?fmtMoney(ambFare()):'—');
  refreshAmbSubmit();
}
function selectVehicle(name){
  ambDraft().vehicle = name;
  document.querySelectorAll('#amb-vehicles .vehicle-opt').forEach(el=>el.classList.toggle('on', el.dataset.veh===name));
  updateFareUI();
}
function refreshAmbSubmit(){
  const d = ambDraft();
  const btn = document.getElementById('amb-submit');
  if(btn) btn.disabled = !(d.pickup && d.drop && d.agree);
}

/* ---- live device location ---- */
function useMyLocation(){
  const d = ambDraft();
  if(!navigator.geolocation){
    d.geoError = 'This browser does not support location sharing. Please set the pickup pin on the map instead.';
    rerenderView(); return;
  }
  showToast('Requesting your location…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll = [pos.coords.latitude, pos.coords.longitude];
    d.geoError = '';
    d.setting = 'pickup';
    placePin('pickup', ll, true);
    if(AMB.map) AMB.map.setView(ll, 16);
    showLiveDot(ll, pos.coords.accuracy);
    startLiveWatch(true);
    showToast('Live location locked to your pickup point');
  }, err=>{
    d.geoError = err.code === 1
      ? 'Location permission was blocked. Allow location for this site in your browser settings (the padlock icon in the address bar), or tap the map to set the pickup pin manually.'
      : 'Could not get your location right now. Tap the map to set the pickup pin manually.';
    rerenderView();
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
}
function showLiveDot(ll, accuracy){
  if(!AMB.map || typeof L==='undefined') return;
  if(!AMB.meMarker){
    AMB.meMarker = L.marker(ll, {icon:L.divIcon({className:'', iconSize:[16,16], iconAnchor:[8,8], html:'<div class="geo-dot" style="position:relative"></div>'}), zIndexOffset:500})
      .addTo(AMB.map).bindTooltip('You are here', {direction:'top', offset:[0,-10]});
  } else AMB.meMarker.setLatLng(ll);
  if(accuracy){
    if(AMB.accCircle) AMB.accCircle.setLatLng(ll).setRadius(accuracy);
    else AMB.accCircle = L.circle(ll, {radius:accuracy, color:'#1E7BE5', weight:1, fillColor:'#1E7BE5', fillOpacity:.1}).addTo(AMB.map);
  }
}
function startLiveWatch(followPickup){
  if(!navigator.geolocation) return;
  AMB.live = true;
  if(AMB.watchId != null) navigator.geolocation.clearWatch(AMB.watchId);
  AMB.watchId = navigator.geolocation.watchPosition(pos=>{
    const ll = [pos.coords.latitude, pos.coords.longitude];
    showLiveDot(ll, pos.coords.accuracy);
    if(followPickup && ambDraft().setting==='pickup'){
      ambDraft().pickupLL = ll;
      drawPin('pickup', ll);
      drawRouteLine();
      updateFareUI();
    }
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}
function stopLiveWatch(){
  if(AMB.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(AMB.watchId);
  AMB.watchId = null;
}

/* ---- geocoding (OpenStreetMap Nominatim) ---- */
async function searchPlace(which){
  const input = document.getElementById(which==='pickup'?'amb-pickup':'amb-drop');
  const q = (input && input.value || '').trim();
  const box = document.getElementById(which==='pickup'?'sg-pickup':'sg-drop');
  if(!q){ showToast('Type an address first'); return; }
  if(box) box.innerHTML = `<div class="suggest-list"><button disabled>Searching…</button></div>`;
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=in&q=${encodeURIComponent(q)}`, {headers:{'Accept':'application/json'}});
    const list = await res.json();
    if(!list.length){ box.innerHTML = `<div class="suggest-list"><button disabled>No match found — try adding the city name, or tap the map.</button></div>`; return; }
    box.innerHTML = `<div class="suggest-list">${list.map((p,i)=>`<button onclick="chooseSuggestion('${which}',${p.lat},${p.lon},${i})">${p.display_name}</button>`).join('')}</div>`;
    window.__sg = window.__sg || {}; window.__sg[which] = list;
  }catch(e){
    box.innerHTML = `<div class="suggest-list"><button disabled>Address search is unavailable offline — tap the map to drop a pin instead.</button></div>`;
  }
}
function chooseSuggestion(which, lat, lon, i){
  const d = ambDraft();
  const item = (window.__sg && window.__sg[which] && window.__sg[which][i]) || {};
  const label = item.display_name || `${lat}, ${lon}`;
  if(which==='pickup') d.pickup = label; else d.drop = label;
  const input = document.getElementById(which==='pickup'?'amb-pickup':'amb-drop');
  if(input) input.value = label;
  const box = document.getElementById(which==='pickup'?'sg-pickup':'sg-drop');
  if(box) box.innerHTML = '';
  placePin(which, [Number(lat), Number(lon)], false);
  if(AMB.map) AMB.map.setView([Number(lat), Number(lon)], 15);
}
async function reverseGeocode(ll, which){
  const d = ambDraft();
  const fallback = `${ll[0].toFixed(5)}, ${ll[1].toFixed(5)}`;
  const input = document.getElementById(which==='pickup'?'amb-pickup':'amb-drop');
  if(which==='pickup'){ d.pickup = d.pickup || fallback; } else { d.drop = d.drop || fallback; }
  if(input && !input.value) input.value = fallback;
  refreshAmbSubmit();
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll[0]}&lon=${ll[1]}`, {headers:{'Accept':'application/json'}});
    const j = await res.json();
    const label = j.display_name || fallback;
    if(which==='pickup') d.pickup = label; else d.drop = label;
    if(input) input.value = label;
  }catch(e){
    if(which==='pickup') d.pickup = fallback; else d.drop = fallback;
    if(input) input.value = fallback;
  }
  refreshAmbSubmit();
}

/* ---- Live ambulance tracking on a real map ---- */
function openAmbulanceTracker(reqId){
  const r = state.ambRequests.find(x=>x.id===reqId);
  if(!r) return;
  clearInterval(window.__trackTimer);
  const seed = reqId.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const rnd = (min,max)=> min + ((seed*9301+49297)%233280)/233280*(max-min);
  const totalSeconds = r.distanceKm ? Math.round(r.distanceKm/0.45*60) : Math.round(rnd(8,18))*60;
  const driverNames = ['Rakesh Tudu','Md. Salim','Bijoy Haldar','Suman Roy','Anwar Sheikh'];
  const driver = driverNames[seed % driverNames.length];
  const plate = (state.ambulanceFleet.find(a=>a.name===r.vehicle)||{}).plate || 'WB 02 AM '+(1000+seed%899);
  const driverPhones = ['+9198300'+(10000+seed%89999).toString().slice(0,5), '+9197400'+(10000+(seed*3)%89999).toString().slice(0,5)];
  const driverPhone = driverPhones[seed % driverPhones.length];
  window.__track = {reqId, elapsed:0, total:totalSeconds, driver, plate, driverPhone, speedFactor:12, map:null, marker:null, trail:null, follow:true, heading:0};
  openModalHTML(trackerHTML());
  mountTrackerMap(r);
  window.__trackTimer = setInterval(()=>{
    const tr = window.__track;
    if(!tr) return clearInterval(window.__trackTimer);
    tr.elapsed += tr.speedFactor;
    if(tr.elapsed >= tr.total){ tr.elapsed = tr.total; clearInterval(window.__trackTimer); }
    const wrap = document.getElementById('tracker-stats');
    if(wrap) wrap.innerHTML = trackerStatsHTML(r);
    else return clearInterval(window.__trackTimer);
    moveTrackerVehicle(r);
  }, 1000);
}
function closeTracker(){
  clearInterval(window.__trackTimer);
  if(window.__track && window.__track.map){ window.__track.map.remove(); }
  window.__track = null;
  closeModal();
}
function trackerHTML(){
  const r = state.ambRequests.find(x=>x.id===window.__track.reqId);
  return `
  <div class="modal-overlay" onclick="if(event.target===this)closeTracker()">
    <div class="modal" style="max-width:520px;">
      <div class="modal-head"><h3>Live ambulance tracking</h3><button class="modal-close" onclick="closeTracker()">✕</button></div>
      <div class="modal-body">
        <div class="tag-row" style="margin-bottom:12px;"><span class="tag">${r.vehicle}</span><span class="tag">${ICONS.pin} ${r.pickup} → ${r.drop}</span></div>
        <div class="map-card">
          <div id="track-map" class="map-el" style="height:260px;"></div>
          <button class="map-recenter on" id="track-follow-btn" onclick="toggleTrackerFollow()" title="Toggle following the ambulance">${ICONS.pin}</button>
        </div>
        <div id="tracker-stats">${trackerStatsHTML(r)}</div>
        <p class="muted-sm" style="margin-top:8px;">Live vehicle position on an OpenStreetMap view. In this prototype the ambulance position is simulated along the pickup → hospital route; wiring a real GPS feed only means replacing the position source.</p>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeTracker()">Close</button></div>
    </div>
  </div>`;
}
function trackerPositions(r){
  // fall back to two nearby points around Kolkata if the request has no coordinates
  const a = r.pickupLL || [22.5726, 88.3639];
  const b = r.dropLL   || [22.5958, 88.4010];
  return [a, b];
}
function trackerPointAt(r, t){
  const [a,b] = trackerPositions(r);
  // slight arc so the path doesn't look like a ruler line
  const mid = [(a[0]+b[0])/2 + (b[1]-a[1])*0.06, (a[1]+b[1])/2 - (b[0]-a[0])*0.06];
  const mt = 1-t;
  return [ mt*mt*a[0] + 2*mt*t*mid[0] + t*t*b[0], mt*mt*a[1] + 2*mt*t*mid[1] + t*t*b[1] ];
}
function mountTrackerMap(r){
  const el = document.getElementById('track-map');
  if(!el) return;
  el.innerHTML = mapLoadingHTML();
  ensureLeaflet(()=>{
    const el2 = document.getElementById('track-map');
    if(!el2 || !window.__track) return; // tracker modal was closed while we waited
    el2.innerHTML = '';
    if(el2._leaflet_id) delete el2._leaflet_id;
    const [a,b] = trackerPositions(r);
    const map = L.map(el2).setView(a, 13);
    L.tileLayer(MAP_TILE, {maxZoom:19, attribution:MAP_ATTR}).addTo(map);
    L.marker(a, {icon:pinIcon('#E2622F','📍')}).addTo(map).bindTooltip('Pickup', {direction:'top', offset:[0,-28]});
    L.marker(b, {icon:pinIcon('#0E4F45','🏥')}).addTo(map).bindTooltip('Hospital', {direction:'top', offset:[0,-28]});
    const pts = Array.from({length:40}, (_,i)=>trackerPointAt(r, i/39));
    L.polyline(pts, {color:'#0E4F45', weight:4, opacity:.6, dashArray:'8 8'}).addTo(map);
    const ambIcon = L.divIcon({className:'veh-animate', iconSize:[34,34], iconAnchor:[17,17],
      html:'<div class="veh-marker-wrap"><div class="veh-heading" id="veh-heading"></div><div class="veh-glyph">🚑</div></div>'});
    window.__track.map = map;
    window.__track.marker = L.marker(a, {icon:ambIcon, zIndexOffset:900}).addTo(map).bindTooltip('Ambulance', {direction:'top', offset:[0,-18]});
    window.__track.trail = L.polyline([a], {color:'#E2622F', weight:5, opacity:.9}).addTo(map);
    window.__track.lastPoint = a;
    map.fitBounds(L.latLngBounds([a,b]).pad(0.25));
    setTimeout(()=>map.invalidateSize(), 150);
  }, ()=>{
    const el3 = document.getElementById('track-map');
    if(el3) el3.innerHTML = mapFailHTML(`mountTrackerMap(state.ambRequests.find(x=>x.id==='${r.id}'))`);
  });
}
function bearingDeg(a, b){
  // heading in degrees (0 = north), used to point the marker's directional arrow like a turn-by-turn nav app
  const toRad = d=>d*Math.PI/180, toDeg = r=>r*180/Math.PI;
  const y = Math.sin(toRad(b[1]-a[1])) * Math.cos(toRad(b[0]));
  const x = Math.cos(toRad(a[0]))*Math.sin(toRad(b[0])) - Math.sin(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.cos(toRad(b[1]-a[1]));
  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}
function toggleTrackerFollow(){
  const tr = window.__track;
  if(!tr) return;
  tr.follow = !tr.follow;
  const btn = document.getElementById('track-follow-btn');
  if(btn){ btn.classList.toggle('on', tr.follow); btn.classList.toggle('off', !tr.follow); }
  if(tr.follow && tr.marker) tr.map.panTo(tr.marker.getLatLng(), {animate:true});
  showToast(tr.follow ? 'Following ambulance' : 'Free look — pan the map freely');
}
function moveTrackerVehicle(r){
  const tr = window.__track;
  if(!tr || !tr.map || !tr.marker) return;
  const t = Math.min(1, tr.elapsed/tr.total);
  const p = trackerPointAt(r, t);
  if(tr.lastPoint && (tr.lastPoint[0]!==p[0] || tr.lastPoint[1]!==p[1])){
    tr.heading = bearingDeg(tr.lastPoint, p);
    const arrow = document.getElementById('veh-heading');
    if(arrow) arrow.style.transform = `rotate(${tr.heading}deg)`;
  }
  tr.lastPoint = p;
  tr.marker.setLatLng(p); // CSS transition on .veh-animate glides this move instead of snapping
  tr.trail.addLatLng(p);
  if(tr.follow) tr.map.panTo(p, {animate:true, duration:.9});
}
function trackerStatsHTML(r){
  const tr = window.__track;
  const pct = Math.min(1, tr.elapsed/tr.total);
  const arrived = pct>=1;
  const remain = Math.max(0, tr.total - tr.elapsed);
  const mins = Math.floor(remain/60), secs = remain%60;
  const totalKm = r.distanceKm || 9.5;
  return `
  <div class="trip-card">
    <div class="trip-progress-track"><div class="trip-progress-fill" style="width:${Math.round(pct*100)}%;"></div></div>
    <div class="trip-eta-row">
      <div class="eta-big">${arrived?'Arrived':(mins+'m '+String(secs).padStart(2,'0')+'s')}<small>${arrived?'trip complete':'to hospital · '+(totalKm*(1-pct)).toFixed(1)+' km left'}</small></div>
      <span class="trip-status-tag ${arrived?'status-completed':'status-approved'}">${arrived?'Arrived':'En route'}</span>
    </div>
    <div class="driver-row">
      <div class="avatar">${initials(tr.driver)}</div>
      <div class="d-info"><b>${tr.driver}</b><span>${r.vehicle} · ${tr.plate}</span></div>
      <div class="driver-actions">
        <a href="tel:${tr.driverPhone}" title="Call driver">${ICONS.phone||'📞'}</a>
        <a href="sms:${tr.driverPhone}" title="Message driver">${ICONS.msg||'💬'}</a>
      </div>
    </div>
  </div>`;
}

    ${r.txnRef?`<span class="utr-badge">${r.txnRef}</span>`:`<span class="muted-sm">No UTR submitted</span>`}
    <span class="pay-pill ${cls}">${st==='Not paid'?'NOT PAID':st}</span>

function reqStoreFor(k){
  if(k==='consult') return state.consultRequests;
  if(k==='diag') return state.diagRequests;
  if(k==='hosp') return state.hospRequests;
  if(k==='amb') return state.ambRequests;
}
function adminRequestTable(key, list, headers, rowFn){
  if(!list.length) return `<h2>${key==='consult'?'Consultation':key==='diag'?'Diagnostic':key==='hosp'?'Hospital / IPD':'Ambulance'} Requests</h2>${emptyState('No requests yet','New requests submitted by users will appear here.')}`;
  return `
  <h2>${key==='consult'?'Consultation':key==='diag'?'Diagnostic':key==='hosp'?'Hospital / IPD':'Ambulance'} Requests</h2>
  <table>
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th>Schedule</th><th>Actions</th></tr></thead>
    <tbody>
      ${list.map((r,i)=>`
        <tr>
          ${rowFn(r).slice(0,-1).map(v=>`<td>${v}</td>`).join('')}
          <td><span class="status-pill status-${r.status.toLowerCase()}">${r.status}</span></td>
          <td>
            <div class="schedule-inline">
              <input type="date" value="${r.scheduledDate||r.date||today()}" onchange="setSchedule('${key}','${r.id}','date',this.value)">
              <input type="time" value="${r.scheduledTimeVal||r.time||'10:00'}" onchange="setSchedule('${key}','${r.id}','time',this.value)">
            </div>
          </td>
          <td>
            <div class="req-actions">
              ${r.fee && r.payStatus!=='Verified' && r.status==='Pending' ? `
                <button class="btn btn-outline btn-sm" onclick="verifyPayment('${key}','${r.id}')">Payment received</button>
                <button class="btn btn-outline btn-sm" onclick="markNotPaid('${key}','${r.id}')">Mark NOT PAID</button>
                <button class="btn btn-danger btn-sm" onclick="rejectUnpaid('${key}','${r.id}')">Reject — not paid</button>`:''}
              ${r.status==='Pending' ? `<button class="btn btn-primary btn-sm" ${r.fee && r.payStatus!=='Verified'?'disabled title="Confirm the payment first"':''} onclick="approveRequest('${key}','${r.id}')">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="rejectRequest('${key}','${r.id}')">Reject</button>` : ''}
              ${r.status==='Approved' ? `<button class="btn btn-outline btn-sm" onclick="completeRequest('${key}','${r.id}')">Mark completed</button>`:''}
              ${r.status==='Rejected'||r.status==='Completed' ? `<span class="muted-sm">No actions</span>`:''}
            </div>
          </td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}
function setSchedule(key, id, field, val){
  const item = reqStoreFor(key).find(r=>r.id===id);
  if(field==='date') item.scheduledDate = val;
  if(field==='time') item.scheduledTimeVal = val;
}
function approveRequest(key, id){
  const item = reqStoreFor(key).find(r=>r.id===id);
  item.status='Approved';
  item.scheduledDate = item.scheduledDate || item.date || today();
  item.scheduledTimeVal = item.scheduledTimeVal || item.time || '10:00';
  item.scheduledTime = item.scheduledDate+' '+item.scheduledTimeVal;
  const kindLabel = key==='consult'?'consultation':key==='diag'?'test booking':key==='hosp'?'hospital booking':'ambulance request';
  addNotification(`Your ${kindLabel} has been approved and scheduled for ${item.scheduledDate} at ${item.scheduledTimeVal}. See you then!`);
  showToast('Approved — WhatsApp notification sent to patient');
  rerenderView();
}
function rejectRequest(key,id){
  const item = reqStoreFor(key).find(r=>r.id===id);
  item.status='Rejected';
  addNotification(`We're unable to confirm your recent request right now. Our team will reach out with alternatives shortly.`);
  showToast('Request rejected — patient notified');
  rerenderView();
}
function completeRequest(key,id){
  const item = reqStoreFor(key).find(r=>r.id===id);
  item.status='Completed';
  rerenderView();
}

function saveServiceForm(hid, sid){

  const price = document.getElementById('ns-price').value.trim();
  const desc = document.getElementById('ns-desc').value.trim();
  if(!title){showToast('Service title is required'); return;}
  const h = state.hospitals.find(x=>x.id===hid);
  if(sid){
    const s = h.ipd.find(x=>x.id===sid);
    Object.assign(s, {title, dept:dept||s.dept, stay:stay||s.stay, price:price||s.price, desc});
    showToast('Service updated');

    h.ipd.push({id:uid('i'), title, dept:dept||'General', stay:stay||'—', price:price||'On request', desc:desc||''});

function vendorLogin(){
  const id = document.getElementById('vendor-login-id').value;
  const pass = document.getElementById('vendor-login-pass').value;
  const v = state.vendors.find(x=>x.id===id);
  if(v && v.status==='Active' && pass===v.password){
    state.currentVendor = v;
    state.vendorLoginError = '';
    state.vendorTab = 'overview';
    showToast('Welcome, '+v.name);
  } else if(v && v.status!=='Active'){
    state.vendorLoginError = 'This vendor account is suspended. Contact admin.';
  } else {
    state.vendorLoginError = 'Incorrect password. Try again.';
  }
  rerenderView();
}
function vendorLogout(){
  state.currentVendor = null;
  showToast('Logged out of vendor panel');
  go('home');
}
function vendorTabContent(tab){
  if(tab==='overview') return vendorOverview();
  if(tab==='requests') return vendorRequests();
  if(tab==='fleet') return vendorFleet();
  if(tab==='tests') return vendorTests();
  if(tab==='hospital') return vendorHospital();
  if(tab==='doctors') return vendorDoctors();
  if(tab==='account') return vendorAccount();
}
function reqKeyForVendorType(type){
  if(type==='Diagnostic Lab') return 'diag';
  if(type==='Hospital') return 'hosp';
  if(type==='Ambulance Fleet') return 'amb';
  if(type==='Doctor / Clinic') return 'consult';
  return null;
}
function vendorOverview(){
  const v = state.currentVendor;
  const key = reqKeyForVendorType(v.type);
  const list = key ? reqStoreFor(key) : [];
  const pending = list.filter(r=>r.status==='Pending').length;
  const serviceCount = v.type==='Ambulance Fleet' ? state.ambulanceFleet.filter(a=>a.vendorId===v.id).length
    : v.type==='Diagnostic Lab' ? state.tests.filter(t=>t.vendorId===v.id).length
    : v.type==='Hospital' ? state.hospitals.filter(h=>h.vendorId===v.id).length
    : v.type==='Doctor / Clinic' ? state.doctors.filter(d=>d.vendorId===v.id).length
    : null;
  const serviceLabel = v.type==='Ambulance Fleet' ? 'Vehicles assigned to you'
    : v.type==='Diagnostic Lab' ? 'Tests listed by you'
    : v.type==='Hospital' ? 'Hospitals listed by you'
    : v.type==='Doctor / Clinic' ? 'Doctors listed by you'
    : '';
  return `
  <h2>Overview</h2>
  <div class="stat-cards">
    <div class="stat-card"><b>${list.length}</b><span>Total requests</span></div>
    <div class="stat-card"><b>${pending}</b><span>Awaiting your action</span></div>
    ${serviceCount!==null?`<div class="stat-card"><b>${serviceCount}</b><span>${serviceLabel}</span></div>`:''}
  </div>
  <p class="muted-sm">${key?`Requests routed to ${v.type} partners appear under "My Requests". Approve, reject or mark them completed as work progresses — the patient gets a simulated WhatsApp update automatically.`:'Your vendor type does not currently route platform requests. Contact admin for details.'}</p>`;
}
function vendorRequests(){
  const v = state.currentVendor;
  const key = reqKeyForVendorType(v.type);
  if(!key) return `<h2>My Requests</h2>${emptyState('No request queue for this vendor type','Ask admin to configure a service line for your account.')}`;
  const list = reqStoreFor(key);
  const headers = key==='consult' ? ['Patient','Doctor','Mode','Date/Time','Fee','Status']
    : key==='diag' ? ['Patient','Test','Collection','Date','Fee','Status']
    : key==='hosp' ? ['Patient','Procedure','Hospital','Date','Status']
    : ['Patient','Vehicle','Route','Status'];
  const rowFn = key==='consult' ? (r=>[r.patient,r.doctorName,r.mode,r.date+' '+r.time,fmtMoney(r.fee),r.status])
    : key==='diag' ? (r=>[r.patient,r.testName,r.collection,r.date,fmtMoney(r.fee),r.status])
    : key==='hosp' ? (r=>[r.patient,r.procedure,r.hospital,r.date,r.status])
    : (r=>[r.patient,r.vehicle,r.pickup+' → '+r.drop,r.status]);
  return `<h2>My Requests</h2>${adminRequestTable(key, list, headers, rowFn)}`;
}

    case 'home': return viewHome();
    case 'doctors': return viewDoctors();
    case 'diagnostics': return viewDiagnostics();
    case 'hospitals': return viewHospitals();
    case 'ambulance': return viewAmbulance();
    case 'admin': return viewAdmin();
    case 'vendor': return viewVendor();
    case 'profile': return viewProfile();
    default: return viewHome();
  }
}
function rerenderView(){
  // tear down any live map before the DOM node it lives on is destroyed
  if(AMB.map){ try{ AMB.map.remove(); }catch(e){} AMB.map=null; AMB.pickupMarker=AMB.dropMarker=AMB.line=AMB.meMarker=AMB.accCircle=null; }
  document.getElementById('app-root').innerHTML = currentViewHTML();
  if(state.view === 'ambulance'){
    mountAmbMap();
  } else {
    stopLiveWatch();
    AMB.live = false;
  }
}
function renderAll(){
  renderNav();
  rerenderView();
  renderFooter();
  renderDrawer();
  renderCartDrawer();
  renderToast();
}
renderAll();
</script>
</body>
</html>
